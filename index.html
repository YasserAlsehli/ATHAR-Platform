else out=lang==='ar'?'أستطيع الإجابة عن الحصص والفجوات والأولويات والمنهجية من ملفات المشروع. اسأل عن منطقة محددة أو قارن منطقتين.':'I can answer about shares, gaps, priorities, and methodology from the project files. Ask about a region or compare two regions.';
out+='\n'+(lang==='ar'?'المصدر: ملف النتائج المعتمد والتقرير التنفيذي.':'Sources: approved results file and executive report.');addBubble(out);if(r)addChatAction(T().goRegion,()=>{selected=r.ar;navigate('decision');document.querySelector('#chat').hidden=true});if(n.includes('مصدر')||n.includes('source')||n.includes('منهج'))addChatAction(T().sources,()=>{navigate('sources');document.querySelector('#chat').hidden=true});if(!fromSuggestion){let s=document.querySelector('#suggest');document.querySelector('#chatBody').appendChild(s)}}
document.querySelector('#chatForm').onsubmit=e=>{e.preventDefault();answer('')};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>answer(b.dataset.q,true));render();
</script></body></html>
